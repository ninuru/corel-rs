name: Build and tag

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: corel-linux-x86_64
          path: target/release/corel

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: corel-master-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: corel-linux-x86_64
          path: .
      - name: Tag current master commit
        shell: bash
        run: |
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "A newer commit is on master; skipping this run."
            exit 0
          fi

          chmod +x ./corel
          tag="$(./corel --auto-init --with-patch)"
          if [[ ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unexpected tag: $tag" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $tag does not point to the current commit." >&2
            exit 1
          fi

          git push origin "refs/tags/$tag"
